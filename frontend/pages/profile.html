<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>پروفائل — اُستاد جی</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/dashboard.css"/>
</head>
<body>

<div id="uj-sidebar" class="uj-sidebar"></div>

<main class="uj-main">

  <div class="page-header">
    <h1 class="page-title-ur ur-only">میرا <span style="color:var(--flame)">پروفائل</span> 👤</h1>
    <h1 class="page-title en-only" style="display:none;">My <span>Profile</span> 👤</h1>
    <p class="page-subtitle" data-ur="اپنی معلومات اپ ڈیٹ کریں" data-en="Update your information">اپنی معلومات اپ ڈیٹ کریں</p>
  </div>

  <div id="uj-alert" class="uj-alert" style="margin-bottom:20px;"></div>

  <div style="display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start;">

    <!-- Profile Card -->
    <div class="uj-card">
      <div style="padding:32px;text-align:center;">
        <div id="profile-avatar" style="width:80px;height:80px;border-radius:20px;
          background:linear-gradient(135deg,var(--flame),var(--flame-soft));
          display:flex;align-items:center;justify-content:center;
          font-size:36px;font-weight:900;color:white;
          font-family:var(--font-display);margin:0 auto 16px;">U</div>
        <h3 id="profile-name" style="font-family:var(--font-display);font-size:20px;font-weight:900;color:var(--ink);margin-bottom:4px;">Loading...</h3>
        <p id="profile-role" style="font-size:13px;color:var(--flame);font-weight:700;text-transform:capitalize;font-family:var(--font-body);margin-bottom:8px;"></p>
        <p id="profile-city" style="font-size:13px;color:var(--ink-soft);font-family:var(--font-body);"></p>
        <div id="profile-badge" style="margin-top:12px;"></div>
      </div>
    </div>

    <!-- Edit Forms -->
    <div>

      <!-- Basic Info -->
      <div class="form-section">
        <div class="form-section-title">
          <i class="fas fa-user" style="color:var(--flame);"></i>
          <span data-ur="بنیادی معلومات" data-en="Basic Information">بنیادی معلومات</span>
        </div>
        <form id="basicForm">
          <div class="two-col">
            <div class="field">
              <label data-ur="پورا نام" data-en="Full Name">پورا نام</label>
              <input type="text" id="full_name" placeholder="Ali Hassan"/>
            </div>
            <div class="field">
              <label data-ur="فون نمبر" data-en="Phone">فون نمبر</label>
              <input type="text" id="phone" placeholder="03XX-XXXXXXX"/>
            </div>
          </div>
          <div class="two-col">
            <div class="field">
              <label data-ur="شہر" data-en="City">شہر</label>
              <select id="city">
                <option value="Islamabad">اسلام آباد — Islamabad</option>
                <option value="Rawalpindi">راولپنڈی — Rawalpindi</option>
                <option value="Lahore">لاہور — Lahore</option>
                <option value="Karachi">کراچی — Karachi</option>
                <option value="Faisalabad">فیصل آباد — Faisalabad</option>
                <option value="Multan">ملتان — Multan</option>
                <option value="Peshawar">پشاور — Peshawar</option>
                <option value="Quetta">کوئٹہ — Quetta</option>
              </select>
            </div>
            <div class="field">
              <label data-ur="علاقہ" data-en="Area">علاقہ</label>
              <input type="text" id="area" placeholder="G-11, DHA..."/>
            </div>
          </div>
          <div class="field">
            <label data-ur="پتہ" data-en="Address">پتہ</label>
            <input type="text" id="address" placeholder="گھر کا پتہ"/>
          </div>
          <button type="submit" class="btn-primary" id="basicBtn"
            style="width:auto;padding:13px 32px;font-size:15px;"
            data-ur="معلومات محفوظ کریں" data-en="Save Information">
            <div class="spin"></div>
            <span class="btn-text" data-ur="💾 محفوظ کریں" data-en="💾 Save">💾 محفوظ کریں</span>
          </button>
        </form>
      </div>

      <!-- Worker Profile Section -->
      <div class="form-section" id="worker-section" style="display:none;">
        <div class="form-section-title">
          <i class="fas fa-tools" style="color:var(--flame);"></i>
          <span data-ur="کاریگر پروفائل" data-en="Worker Profile">کاریگر پروفائل</span>
        </div>
        <form id="workerForm">
          <div class="two-col">
            <div class="field">
              <label data-ur="خدمت کی قسم" data-en="Service Category">خدمت کی قسم</label>
              <select id="w-category"></select>
            </div>
            <div class="field">
              <label data-ur="تجربہ (سال)" data-en="Experience (Years)">تجربہ (سال)</label>
              <input type="number" id="w-experience" min="0" max="50" placeholder="5"/>
            </div>
          </div>
          <div class="field">
            <label data-ur="مہارتیں" data-en="Skills">مہارتیں</label>
            <input type="text" id="w-skills" placeholder="Wiring, AC repair, Fan installation..."/>
          </div>
          <div class="two-col">
            <div class="field">
              <label data-ur="فی گھنٹہ ریٹ (₨)" data-en="Hourly Rate (₨)">فی گھنٹہ ریٹ (₨)</label>
              <input type="number" id="w-rate" min="0" placeholder="500"/>
            </div>
            <div class="field">
              <label data-ur="دستیابی" data-en="Availability">دستیابی</label>
              <select id="w-available">
                <option value="1" data-ur="دستیاب ہوں" data-en="Available">دستیاب ہوں</option>
                <option value="0" data-ur="ابھی مصروف ہوں" data-en="Currently Busy">ابھی مصروف ہوں</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label data-ur="اپنے بارے میں لکھیں" data-en="Bio / About You">اپنے بارے میں لکھیں</label>
            <textarea id="w-bio" rows="3"
              data-ph-ur="مثلاً: میں ۱۰ سال سے الیکٹریشن کا کام کر رہا ہوں..."
              data-ph-en="E.g.: I have been working as an electrician for 10 years..."
              placeholder="مثلاً: میں ۱۰ سال سے الیکٹریشن کا کام کر رہا ہوں..."></textarea>
          </div>
          <button type="submit" class="btn-primary" id="workerBtn"
            style="width:auto;padding:13px 32px;font-size:15px;"
            data-ur="پروفائل محفوظ کریں" data-en="Save Profile">
            <div class="spin"></div>
            <span class="btn-text" data-ur="💾 پروفائل محفوظ کریں" data-en="💾 Save Profile">💾 پروفائل محفوظ کریں</span>
          </button>
        </form>
      </div>

      <!-- Change Password -->
      <div class="form-section">
        <div class="form-section-title">
          <i class="fas fa-lock" style="color:var(--flame);"></i>
          <span data-ur="پاس ورڈ تبدیل کریں" data-en="Change Password">پاس ورڈ تبدیل کریں</span>
        </div>
        <form id="passwordForm">
          <div class="two-col">
            <div class="field">
              <label data-ur="موجودہ پاس ورڈ" data-en="Current Password">موجودہ پاس ورڈ</label>
              <input type="password" id="current_password"
                data-ph-ur="موجودہ پاس ورڈ"
                data-ph-en="Current password"
                placeholder="موجودہ پاس ورڈ"/>
            </div>
            <div class="field">
              <label data-ur="نیا پاس ورڈ" data-en="New Password">نیا پاس ورڈ</label>
              <input type="password" id="new_password"
                data-ph-ur="نیا پاس ورڈ (کم از کم ۶)"
                data-ph-en="New password (min 6)"
                placeholder="نیا پاس ورڈ"/>
            </div>
          </div>
          <button type="submit" class="btn-outline" id="pwBtn"
            style="padding:13px 32px;font-size:15px;"
            data-ur="پاس ورڈ تبدیل کریں" data-en="Change Password">
            <div class="spin" style="border-color:rgba(232,64,12,0.3);border-top-color:var(--flame);"></div>
            <span class="btn-text" data-ur="🔒 پاس ورڈ تبدیل کریں" data-en="🔒 Change Password">🔒 پاس ورڈ تبدیل کریں</span>
          </button>
        </form>
      </div>

    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="../js/main.js"></script>
<script src="../js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  requireAuth();
  const user = Auth.getUser();
  buildSidebar('profile');

  // Set avatar
  document.getElementById('profile-avatar').textContent = user.full_name.charAt(0).toUpperCase();
  document.getElementById('profile-name').textContent   = user.full_name;
  document.getElementById('profile-role').textContent   = user.role;

  // Load full profile
  $.ajax({
    url: `${API_BASE}/auth/profile`,
    headers: authHeader(),
    success: function(res) {
      if (!res.success) return;
      const u = res.user;

      document.getElementById('full_name').value = u.full_name || '';
      document.getElementById('phone').value     = u.phone || '';
      document.getElementById('address').value   = u.address || '';
      document.getElementById('area').value      = u.area || '';
      if (u.city) document.getElementById('city').value = u.city;
      document.getElementById('profile-city').textContent = u.city || '';

      // Show worker section
      if (u.role === 'worker') {
        document.getElementById('worker-section').style.display = 'block';
        loadWorkerProfile();
      }

      // Badge
      if (u.is_verified) {
        document.getElementById('profile-badge').innerHTML =
          `<span class="badge badge-green"><i class="fas fa-check-circle"></i> Verified</span>`;
      }
    }
  });

  // Load categories for worker
  $.get(`${API_BASE}/workers/categories`, function(res) {
    if (res.success) {
      res.categories.forEach(c => {
        $('#w-category').append(`<option value="${c.id}">${c.name}</option>`);
      });
    }
  });
});

function loadWorkerProfile() {
  const user = Auth.getUser();
  $.ajax({
    url: `${API_BASE}/workers/${user.id}`,
    headers: authHeader(),
    success: function(res) {
      if (!res.success) return;
      const w = res.worker;
      document.getElementById('w-bio').value        = w.bio || '';
      document.getElementById('w-experience').value = w.experience_years || 0;
      document.getElementById('w-skills').value     = w.skills || '';
      document.getElementById('w-rate').value       = w.hourly_rate || 500;
      document.getElementById('w-available').value  = w.is_available ? '1' : '0';
      setTimeout(() => {
        if (w.category_id) $('#w-category').val(w.category_id);
      }, 500);
    }
  });
}

// ── Basic Info Form ──
$('#basicForm').on('submit', function(e) {
  e.preventDefault();
  setLoading('basicBtn', true);

  $.ajax({
    url: `${API_BASE}/auth/profile`,
    method: 'PUT',
    headers: authHeader(),
    contentType: 'application/json',
    data: JSON.stringify({
      full_name: $('#full_name').val().trim(),
      phone:     $('#phone').val().trim(),
      city:      $('#city').val(),
      area:      $('#area').val().trim(),
      address:   $('#address').val().trim()
    }),
    success: function(res) {
      showAlert('success',
        '✅ معلومات محفوظ ہو گئیں!',
        '✅ Information saved!');
      setLoading('basicBtn', false);

      // Update stored user
      const user = Auth.getUser();
      user.full_name = $('#full_name').val().trim();
      user.city      = $('#city').val();
      Auth.setUser(user);
      document.getElementById('profile-name').textContent = user.full_name;
      document.getElementById('profile-city').textContent = user.city;
      document.getElementById('profile-avatar').textContent = user.full_name.charAt(0).toUpperCase();
    },
    error: function(xhr) {
      showAlert('error',
        xhr.responseJSON?.message || 'محفوظ نہیں ہو سکا۔',
        xhr.responseJSON?.message || 'Could not save.');
      setLoading('basicBtn', false);
    }
  });
});

// ── Worker Profile Form ──
$('#workerForm').on('submit', function(e) {
  e.preventDefault();
  setLoading('workerBtn', true);

  $.ajax({
    url: `${API_BASE}/workers/profile`,
    method: 'PUT',
    headers: authHeader(),
    contentType: 'application/json',
    data: JSON.stringify({
      category_id:      parseInt($('#w-category').val()),
      experience_years: parseInt($('#w-experience').val()) || 0,
      skills:           $('#w-skills').val().trim(),
      hourly_rate:      parseFloat($('#w-rate').val()) || 500,
      is_available:     $('#w-available').val() === '1',
      bio:              $('#w-bio').val().trim()
    }),
    success: function(res) {
      showAlert('success',
        '✅ پروفائل محفوظ ہو گئی!',
        '✅ Profile saved!');
      setLoading('workerBtn', false);
    },
    error: function(xhr) {
      showAlert('error',
        xhr.responseJSON?.message || 'محفوظ نہیں ہو سکا۔',
        xhr.responseJSON?.message || 'Could not save.');
      setLoading('workerBtn', false);
    }
  });
});

// ── Password Form ──
$('#passwordForm').on('submit', function(e) {
  e.preventDefault();
  const current = $('#current_password').val();
  const newPw   = $('#new_password').val();

  if (!current || !newPw) {
    showAlert('error', 'دونوں فیلڈ بھریں۔', 'Please fill both fields.');
    return;
  }
  if (newPw.length < 6) {
    showAlert('error', 'نیا پاس ورڈ کم از کم ۶ حروف کا ہو۔', 'New password must be at least 6 characters.');
    return;
  }

  setLoading('pwBtn', true);

  $.ajax({
    url: `${API_BASE}/auth/change-password`,
    method: 'PUT',
    headers: authHeader(),
    contentType: 'application/json',
    data: JSON.stringify({ current_password: current, new_password: newPw }),
    success: function(res) {
      showAlert('success',
        '✅ پاس ورڈ تبدیل ہو گیا!',
        '✅ Password changed!');
      $('#passwordForm')[0].reset();
      setLoading('pwBtn', false);
    },
    error: function(xhr) {
      showAlert('error',
        xhr.responseJSON?.message || 'پاس ورڈ تبدیل نہیں ہو سکا۔',
        xhr.responseJSON?.message || 'Could not change password.');
      setLoading('pwBtn', false);
    }
  });
});

function showAlert(type, urMsg, enMsg) {
  const el = document.getElementById('uj-alert');
  const msg = Lang.current === 'en' ? enMsg : urMsg;
  el.className = `uj-alert uj-alert-${type} show`;
  el.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}`;
  setTimeout(() => el.classList.remove('show'), 4000);
}
</script>
</body>
</html>
